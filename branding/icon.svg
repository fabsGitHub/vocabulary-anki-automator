<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: a selected word, with the text caret at its end, sits on a flashcard in front of a deck.
       1024 grid. Body 824x824 at (100,100), r=185. Front card, selection and caret stem are on the 32-unit grid.
       Layers stay separate (body, back card, front card, selection, word, caret) for tinted or clear variants. -->
  <defs>
    <linearGradient id="icon-body" x1="412" y1="100" x2="612" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A5C"/>
      <stop offset="1" stop-color="#E2306B"/>
    </linearGradient>
    <linearGradient id="icon-sheen" x1="0" y1="100" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="icon-paper" x1="0" y1="352" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF5F3"/>
    </linearGradient>
    <linearGradient id="icon-sel" x1="0" y1="416" x2="0" y2="544" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AE98FF"/>
      <stop offset="1" stop-color="#9478FA"/>
    </linearGradient>
    <linearGradient id="icon-ink" x1="0" y1="402" x2="0" y2="558" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A1650"/>
      <stop offset="1" stop-color="#2C0F40"/>
    </linearGradient>
    <filter id="icon-bodyShadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dy="12" result="o"/>
      <feGaussianBlur in="o" stdDeviation="14" result="b"/>
      <feFlood flood-color="#000000" flood-opacity="0.28"/>
      <feComposite in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="icon-cardShadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dy="18" result="o"/>
      <feGaussianBlur in="o" stdDeviation="20" result="b"/>
      <feFlood flood-color="#7A1238" flood-opacity="0.3"/>
      <feComposite in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="layer-body">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#icon-body)" filter="url(#icon-bodyShadow)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#icon-sheen)"/>
  </g>

  <g id="layer-back-card">
    <rect x="-264" y="-204" width="528" height="408" rx="64" fill="#FFFFFF" fill-opacity="0.55"
          transform="translate(547.4 451.1) rotate(-10)"/>
  </g>

  <g id="layer-front-card">
    <rect x="192" y="352" width="576" height="448" rx="64" fill="url(#icon-paper)" filter="url(#icon-cardShadow)"/>
    <rect x="256" y="640" width="448" height="32" rx="16" fill="#D9D0F0"/>
    <rect x="256" y="704" width="320" height="32" rx="16" fill="#D9D0F0"/>
  </g>

  <g id="layer-selection">
    <path d="M280 416H624V544H280A24 24 0 0 1 256 520V440A24 24 0 0 1 280 416Z" fill="url(#icon-sel)"/>
  </g>

  <g id="layer-word">
    <rect x="304" y="464" width="256" height="32" rx="16" fill="url(#icon-ink)"/>
  </g>

  <g id="layer-caret">
    <path d="M586 402H662A14 14 0 0 1 662 430H648A8 8 0 0 0 640 438V522A8 8 0 0 0 648 530H662A14 14 0 0 1 662 558H586A14 14 0 0 1 586 530H600A8 8 0 0 0 608 522V438A8 8 0 0 0 600 430H586A14 14 0 0 1 586 402Z" fill="url(#icon-ink)"/>
  </g>
</svg>
