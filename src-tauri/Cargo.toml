[package]
name = "vocab-automator"
version = "0.1.0"
description = "Streamlined background vocabulary automation for Anki"
authors = ["Fabian Hensel"]
edition = "2021"

[lib]
name = "vocab_automator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Tauri and its plugins
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-opener.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-updater.workspace = true

# Shared core and the Anki boundary
vocab-core.workspace = true
anki-bridge.workspace = true

async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
hex.workspace = true
log.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

# Synthetic copy keystroke (not in [workspace.dependencies]; unchanged from before the split)
enigo = { version = "0.2", features = ["serde"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
wiremock.workspace = true
