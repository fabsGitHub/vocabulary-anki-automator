[package]
name = "vocab-automator"
version = "0.1.0"
description = "Streamlined background vocabulary automation for Anki"
authors = ["Fabian Hensel"]
edition = "2021"

[lib]
name = "vocab_automator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Tauri Core Framework & Core Engine Plugins
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-opener.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-updater.workspace = true

# Networking & Modern Async Subsystems (Consolidated Duplicates)
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
tokio = { version = "1.0", features = ["full"] }
urlencoding = "2.1"

# Serialization, Diagnostics & Data Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
log = "0.4"
base64 = "0.22"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }

# OS Native Automation Layer
enigo = { version = "0.2", features = ["serde"] }
