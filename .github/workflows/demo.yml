# Builds Learn's live demo (docs/live-demo.md) and publishes it with GitHub
# Pages. It runs only when started by hand (Actions > Live demo > Run
# workflow): Pages needs the repository to be public, or a plan that
# includes Pages for private repositories, and "GitHub Actions" chosen as
# the source under Settings > Pages. Other hosts build the demo themselves
# with `npm run learn:build:demo`, as the doc describes.
#
# The repository variable DEMO_PROJECT_URL, when set, adds a link to the
# page that presents the project to the demo's bar.
#
# Third-party actions are pinned to full commit SHAs, as in ci.yml; the
# trailing comment names the tag.

name: Live demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run learn:build:demo
        env:
          VITE_DEMO_PROJECT_URL: ${{ vars.DEMO_PROJECT_URL }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/learn/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
