# Lint + the fast test tiers on every push to main and every pull request.
# Runs the same entry point as the local watch loop and pre-commit hook
# (scripts/run-all-checks.sh), so CI and local results cannot drift apart.
#
# Third-party actions are pinned to full commit SHAs (supply-chain hygiene,
# same spirit as Milestone E); the trailing comment names the tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The token stays out of .git/config, where the npm and cargo code the
      # checks run could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (rustfmt, clippy, vue-tsc, ESLint, Prettier)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          npx vue-tsc --noEmit
          npx vue-tsc --noEmit -p apps/learn
          npm run lint

      - name: Unit + integration tests
        shell: bash
        run: ./scripts/run-all-checks.sh

      - name: Production frontend builds (Automator, Learn desktop + web)
        run: |
          npm run build
          npm run learn:build
          npm run learn:build:web

      # What `tauri build` adds to cargo, which the steps above never run: the
      # CLI's crate/npm version check, beforeBuildCommand and its cwd, and the
      # frontend embedded from frontendDist. Bundling and signing stay in
      # release.yml.
      - name: Tauri builds without bundling (Automator, Learn)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm run tauri -- build --debug --no-bundle
          npm run learn:tauri -- build --debug --no-bundle
