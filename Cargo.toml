# Cargo workspace for vocabulary-anki-automator (Milestone B, decision 10).
#
# Members:
#   src-tauri          — `Automator`, the desktop clipboard-capture app (Tauri 2)
#   crates/vocab-core  — shared, platform-agnostic core: Card model, providers,
#                        capture pipeline, SQLite store, FSRS scheduling, quiz engine
#   crates/anki-bridge — AnkiConnect client + the Card -> Anki note mapper (decision 4:
#                        the only place Anki field names exist)
#   tools/hsk-import   — one-time HSK 3.0 curriculum ETL (not shipped with the apps)
#
# `apps/learn/src-tauri` (Milestone I) joins as a member when the Learn app lands.
#
# See docs/architecture.md for the module map and cross-crate contracts.

[workspace]
resolver = "2"
members = ["src-tauri", "crates/vocab-core", "crates/anki-bridge", "tools/hsk-import"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
vocab-core = { path = "crates/vocab-core" }
anki-bridge = { path = "crates/anki-bridge" }

# Already-present dependencies (versions match what src-tauri used before the split).
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
hex = "0.4"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4"] }

# New dependencies approved by the operator on 2026-10-31 (Tier 2). Versions are
# pinned to releases that were at least ~3 weeks old at approval time.
rusqlite = { version = "0.40", features = ["bundled"] }
rs-fsrs = "1.2.1"
pinyin = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Test-only.
tempfile = "3"
wiremock = "0.6"
